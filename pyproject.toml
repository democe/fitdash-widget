[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitdash-widget"
version = "0.1.0"
description = "Local Google Health backend for the FitDash Noctalia widget"
requires-python = ">=3.11"
dependencies = ["google-auth>=2.40,<3", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3", "keyring>=25,<26", "SecretStorage>=3.3,<4"]

[project.scripts]
fitdash = "fitdash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/fitdash"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

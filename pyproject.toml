[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fitdash-widget"
version = "0.0.3"
description = "Local Google Health backend for the FitDash Noctalia widget"
readme = "README.md"
authors = [{ name = "Shawn Reavis" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["google-auth>=2.40,<3", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3", "keyring>=25,<26", "SecretStorage>=3.3,<4"]

[project.scripts]
fitdash = "fitdash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/fitdash"]

[tool.hatch.build.targets.wheel.force-include]
"translations" = "fitdash/translations"

[dependency-groups]
dev = [
    "mypy>=1.10,<3",
    "pytest>=8,<10",
    "pytest-cov>=7.1.0",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=fitdash --cov-report=term-missing --cov-fail-under=85"

[tool.mypy]
ignore_missing_imports = true
